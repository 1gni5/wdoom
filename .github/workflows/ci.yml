name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: mymindstorm/setup-emscripten@v16
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:relay
      - run: npm run test:net
