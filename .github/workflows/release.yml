name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: mymindstorm/setup-emscripten@v16
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:relay

      - name: Package artefacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p out
          # Static game (host on any static site; set relayUrl in config.js)
          tar -czf "out/web-doom-web-${VERSION}.tar.gz" -C web .
          # Relay server only (node server/relay.mjs)
          tar -czf "out/web-doom-relay-${VERSION}.tar.gz" package.json package-lock.json server/relay.mjs
          (cd out && sha256sum * > SHA256SUMS)

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
